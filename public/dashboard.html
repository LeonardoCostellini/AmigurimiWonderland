<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Amigurumi Wonderland</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #FBF6EC;
      --paper-deep: #F3E9D6;
      --ink: #211711;
      --on-ink: #F3E9D6;
      --on-ink-muted: #B7A488;
      --marigold: #E2A73C;
      --marigold-deep: #B8842A;
      --berry: #C14C43;
      --berry-light: #F7DCD8;
      --blue: #4F6BE5;
      --blue-light: #E4E9FC;
      --text: #211711;
      --muted: #8A7A5C;
      --border: #E4D7BE;
      --font-display: 'Fraunces', Georgia, serif;
      --font-body: 'DM Sans', system-ui, sans-serif;
      --font-mono: 'Space Mono', 'Courier New', monospace;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
      --shadow-sm: 0 2px 10px rgba(33,23,17,0.06);
      --shadow-md: 0 14px 34px rgba(33,23,17,0.10);
      --shadow-lg: 0 30px 70px rgba(33,23,17,0.18);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-body);
      background: var(--paper);
      color: var(--text);
    }

    /* HEADER */
    .header {
      padding: 1.4rem 2.8rem;
      background: linear-gradient(135deg, #FBF5E6 0%, #F5E8C8 100%);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky; top: 0; z-index: 50;
      box-shadow: var(--shadow-sm);
      border-bottom: 1px solid var(--border);
    }

    .header-title {
      font-family: var(--font-display);
      font-style: italic;
      font-size: 1.35rem;
      font-weight: 600;
      color: var(--text);
      display: flex; align-items: center; gap: 0.6rem;
    }

    .header-badge {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--marigold-deep);
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.5);
      padding: 0.35rem 0.8rem;
      border-radius: 99px;
    }

    /* CONTENT */
    .content { padding: 2.6rem 2.8rem 4rem; max-width: 1400px; margin: 0 auto; }

    .form-eyebrow {
      display: flex; align-items: center; gap: 0.6rem;
      font-family: var(--font-mono);
      font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--marigold-deep); font-weight: 700;
      margin-bottom: 0.9rem;
    }
    .form-eyebrow::before { content: ''; width: 20px; height: 1.5px; background: var(--marigold-deep); }

    /* FORM */
    #productForm {
      max-width: 820px;
      background: #FFFFFF;
      padding: 2.2rem;
      border-radius: 22px;
      margin: 0 auto 3.2rem auto;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    #productForm #name, #productForm #description, #productForm button { grid-column: span 2; }
    #productForm input, #productForm textarea {
      width: 100%; padding: 0.85rem 1rem; border-radius: 12px;
      border: 1.5px solid var(--border); font-family: inherit;
      font-size: 0.92rem; color: var(--text); background: var(--paper);
      transition: all 0.25s;
    }
    #productForm input:focus, #productForm textarea:focus {
      outline: none; border-color: var(--marigold-deep); background: white;
      box-shadow: 0 0 0 4px rgba(226,167,60,0.16);
    }
    #productForm textarea { resize: vertical; min-height: 90px; }
    #productForm button {
      background: var(--marigold); color: var(--text);
      border: none; padding: 0.95rem; border-radius: 99px;
      font-weight: 700; font-size: 0.95rem; cursor: pointer;
      transition: all 0.3s var(--ease);
      margin-top: 0.3rem;
    }
    #productForm button:hover {
      background: var(--marigold-deep); color: white;
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(184,132,42,0.3);
    }

    /* GRID */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 1.6rem;
      align-items: stretch;
    }

    .card {
      background: #FFFFFF;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100%;
      transition: transform 0.4s var(--ease), box-shadow 0.4s var(--ease);
    }
    .card:hover { transform: translateY(-6px); box-shadow: var(--shadow-lg); }

    .card-main-image {
      width: 100%; height: 200px; object-fit: cover; background: var(--paper-deep);
      cursor: pointer;
      transition: transform 0.5s var(--ease);
    }
    .card-main-image:hover { transform: scale(1.03); }

    .card h3 {
      font-family: var(--font-display);
      font-size: 1.05rem;
      font-weight: 600;
      margin: 1rem 1.2rem 0.3rem;
      height: 46px;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .card > p {
      font-size: 0.78rem;
      color: var(--marigold-deep);
      font-family: var(--font-mono);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin: 0 1.2rem 0.5rem;
    }

    .card > p + p {
      font-size: 0.85rem;
      color: var(--muted);
      font-family: var(--font-body);
      text-transform: none;
      letter-spacing: normal;
      flex-grow: 1;
      margin-bottom: 0.8rem;
      height: 56px;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
    }

    .card strong {
      display: block;
      margin: 0 1.2rem 1rem;
      font-family: var(--font-mono);
      font-size: 1.1rem;
      color: var(--text);
    }

    .card-actions {
      padding: 1rem 1.2rem;
      margin-top: auto;
      display: flex;
      gap: 0.6rem;
      border-top: 1px dashed var(--border);
    }

    .btn-edit, .btn-delete {
      flex: 1; padding: 0.65rem; border-radius: 10px; border: none;
      color: white; font-weight: 600; cursor: pointer; font-size: 0.85rem;
      transition: all 0.25s;
    }
    .btn-edit { background: var(--blue); }
    .btn-edit:hover { filter: brightness(1.08); transform: translateY(-1px); }
    .btn-delete { background: var(--berry); }
    .btn-delete:hover { filter: brightness(1.08); transform: translateY(-1px); }

    /* MODAL (product create/edit reference — used by dashboard.js gallery viewer) */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(33,23,17,0.65);
      display: none; align-items: center; justify-content: center; z-index: 9999;
      backdrop-filter: blur(6px);
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: var(--paper); padding: 1.6rem; border-radius: 22px;
      width: 90%; max-width: 560px; position: relative;
      box-shadow: var(--shadow-lg);
    }
    .modal img#modalMainImage {
      width: 100%; height: 360px; object-fit: cover; border-radius: 14px;
      background: var(--paper-deep);
    }
    .modal .modal-thumbs {
      display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap;
    }
    .modal .modal-thumbs img {
      width: 58px; height: 58px; object-fit: cover; border-radius: 8px;
      cursor: pointer; opacity: 0.6; transition: all 0.2s;
      border: 2px solid transparent;
    }
    .modal .modal-thumbs img:hover { opacity: 1; border-color: var(--marigold-deep); }
    .modal-close {
      position: absolute; top: 14px; right: 14px;
      width: 32px; height: 32px; border-radius: 50%;
      background: rgba(33,23,17,0.08); border: none; cursor: pointer;
      font-size: 1rem; color: var(--text);
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
    }
    .modal-close:hover { background: var(--berry); color: white; }

    .empty-state {
      text-align: center; padding: 3rem 1rem; color: var(--muted);
      font-family: var(--font-mono); font-size: 0.85rem;
      grid-column: 1 / -1;
    }

    @media (max-width: 640px) {
      .header { padding: 1.1rem 1.4rem; }
      .content { padding: 1.8rem 1.2rem 3rem; }
      #productForm { grid-template-columns: 1fr; padding: 1.6rem; }
      #productForm input, #productForm textarea, #productForm button { grid-column: span 1; }
    }
  </style>

  <script>
    if (!localStorage.getItem('token')) { window.location.href = '/login.html' }
  </script>
</head>
<body>

  <div class="header">
    <div class="header-title">🧶 Painel Administrativo</div>
    <span class="header-badge">Amigurumi Wonderland</span>
  </div>

  <div class="content">
    <span class="form-eyebrow">Novo produto</span>
    <form id="productForm">
      <input type="text" id="name" placeholder="Nome do Produto" required>
      <input type="text" id="imageUrl1" placeholder="URL Imagem Principal" required>
      <input type="text" id="imageUrl2" placeholder="URL Imagem 2 (Opcional)">
      <input type="text" id="imageUrl3" placeholder="URL Imagem 3 (Opcional)">
      <input type="text" id="category" placeholder="Categoria (ex: Animal, Pokémon)">
      <textarea id="description" placeholder="Descrição do produto..."></textarea>
      <input type="number" id="price" step="0.01" placeholder="Preço (Ex: 99.90)" required>
      <button type="submit">Salvar Produto</button>
    </form>

    <div id="products" class="products-grid"></div>
  </div>

  <!-- IMAGE GALLERY MODAL (referenced by dashboard.js openImageModal/closeImageModal) -->
  <div class="modal-overlay" id="imageModal">
    <div class="modal">
      <button class="modal-close" onclick="closeImageModal()">✕</button>
      <img id="modalMainImage" src="" alt="Produto">
      <div class="modal-thumbs" id="modalThumbs"></div>
    </div>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>

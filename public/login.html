<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Amigurumi Wonderland</title>
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon.png">
  <link rel="icon" type="image/png" sizes="16x16" href="img/favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="img/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --paper: #FBF6EC;
      --ink: #211711;
      --on-ink: #F3E9D6;
      --on-ink-muted: #B7A488;
      --marigold: #E2A73C;
      --marigold-deep: #B8842A;
      --berry: #C14C43;
      --berry-light: #F7DCD8;
      --border: #E4D7BE;
      --text: #211711;
      --muted: #8A7A5C;
      --font-display: 'Fraunces', Georgia, serif;
      --font-body: 'DM Sans', system-ui, sans-serif;
      --font-mono: 'Space Mono', 'Courier New', monospace;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }

    body {
      font-family: var(--font-body);
      background: linear-gradient(150deg, #FFF9EC 0%, var(--paper) 45%, #F5E8C8 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: absolute; top: -220px; right: -160px;
      width: 620px; height: 620px;
      background: radial-gradient(circle, rgba(212,168,67,0.22) 0%, transparent 68%);
      border-radius: 50%;
      pointer-events: none;
    }
    body::after {
      content: '';
      position: absolute; bottom: -260px; left: -180px;
      width: 520px; height: 520px;
      background: radial-gradient(circle, rgba(224,82,82,0.08) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }

    .login-card {
      background: var(--white, #fff);
      padding: 3.2rem 2.6rem;
      border-radius: 26px;
      box-shadow: 0 30px 70px rgba(100,70,20,0.16);
      width: 100%;
      max-width: 420px;
      text-align: left;
      position: relative;
      z-index: 1;
      animation: riseIn 0.6s var(--ease) both;
    }

    .badge {
      display: inline-flex; align-items: center; gap: 0.5rem;
      font-family: var(--font-mono);
      font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--marigold-deep); font-weight: 700;
      margin-bottom: 1.4rem;
    }
    .badge::before { content: ''; width: 20px; height: 1.5px; background: var(--marigold-deep); }

    .login-card h2 {
      margin: 0 0 0.5rem 0;
      color: var(--text);
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 600;
      font-style: italic;
      letter-spacing: -0.01em;
    }

    .login-card .subtitle {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 2.2rem;
      font-weight: 400;
    }

    .form-group {
      text-align: left;
      margin-bottom: 1.1rem;
    }

    .form-group label {
      display: block;
      color: var(--text);
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-family: var(--font-mono);
      margin-bottom: 0.5rem;
    }

    .login-card input {
      width: 100%;
      padding: 0.9rem 1.05rem;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-size: 0.95rem;
      font-family: var(--font-body);
      box-sizing: border-box;
      transition: all 0.25s;
      background: #FFFFFF;
      color: var(--text);
    }

    .login-card input::placeholder { color: #C4B69B; }

    .login-card input:focus {
      outline: none;
      border-color: var(--marigold-deep);
      box-shadow: 0 0 0 4px rgba(226,167,60,0.16);
    }

    .login-card button {
      width: 100%;
      padding: 0.95rem;
      background: var(--marigold);
      color: var(--text);
      border: none;
      border-radius: 99px;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: all 0.3s var(--ease);
      margin-top: 0.6rem;
      font-family: var(--font-body);
      box-shadow: 0 10px 24px rgba(184,132,42,0.25);
    }

    .login-card button:hover {
      background: var(--marigold-deep);
      color: white;
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(184,132,42,0.35);
    }

    .login-card button:active { transform: translateY(0); }

    .back-link {
      margin-top: 1.6rem;
      color: var(--muted);
      font-size: 0.85rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: color 0.3s;
    }

    .back-link:hover { color: var(--marigold-deep); }

    .error-message {
      color: var(--berry);
      margin-top: 1rem;
      font-size: 0.85rem;
      display: none;
      background: var(--berry-light);
      padding: 0.85rem 1rem;
      border-radius: 10px;
    }

    .loading {
      display: none;
      margin-top: 0.8rem;
      color: var(--muted);
      font-size: 0.85rem;
      font-family: var(--font-mono);
    }

    @keyframes riseIn {
      from { opacity: 0; transform: translateY(24px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @media (max-width: 480px) {
      .login-card { padding: 2.6rem 1.8rem; }
      .login-card h2 { font-size: 1.7rem; }
    }
  </style>
</head>
<body>
  <div class="login-card">
    <span class="badge">Painel administrativo</span>
    <h2>Bem-vinda de volta</h2>
    <p class="subtitle">Faça login para gerenciar sua loja</p>

    <form id="loginForm" onsubmit="event.preventDefault(); login();">
      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          placeholder="seu@email.com"
          required
          autocomplete="email"
        />
      </div>

      <div class="form-group">
        <label for="password">Senha</label>
        <input
          type="password"
          id="password"
          placeholder="••••••"
          required
          autocomplete="current-password"
        />
      </div>

      <button type="submit">Entrar</button>
    </form>

    <div class="error-message" id="errorMessage"></div>
    <div class="loading" id="loading">Carregando...</div>

    <a href="/" class="back-link">← Voltar para a loja</a>
  </div>

<script>
async function login() {
  const email = document.getElementById('email').value
  const password = document.getElementById('password').value

  const errorBox = document.getElementById('errorMessage')
  errorBox.style.display = 'none'

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    })

    const text = await res.text()
    let data

    try {
      data = JSON.parse(text)
    } catch {
      throw new Error('Resposta inválida do servidor')
    }

    if (!res.ok) {
      errorBox.textContent = data.error || 'Erro ao fazer login'
      errorBox.style.display = 'block'
      return
    }

    localStorage.setItem('token', data.token)
    window.location.href = '/dashboard.html'

  } catch (err) {
    errorBox.textContent = err.message || 'Erro inesperado'
    errorBox.style.display = 'block'
  }
}
</script>
</body>
</html>
